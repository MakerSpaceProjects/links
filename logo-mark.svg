<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-labelledby="msp-title">
  <title id="msp-title">MakerSpace Projects</title>
  <!--
    Bildmarke: zwei Scheinwerfer-Lichtkegel, an der Mittelachse gespiegelt.
    Ihre Silhouette bildet ein M, Überlappung und Lichtflecken verstärken sich in der Mitte.
    Raster: 200 × 200, Marke ca. 92 × 97 (x 54–146, y 45–142), optisch leicht über der Mitte.
  -->
  <defs>
    <radialGradient id="msp-bg" cx="50%" cy="42%" r="60%">
      <stop offset="0" stop-color="#171717"/>
      <stop offset="1" stop-color="#0a0a0a"/>
    </radialGradient>
    <linearGradient id="msp-beam" x1="0" y1="50" x2="0" y2="134" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f3eee6" stop-opacity=".22"/>
      <stop offset=".55" stop-color="#f3eee6" stop-opacity=".38"/>
      <stop offset="1" stop-color="#f3eee6" stop-opacity=".55"/>
    </linearGradient>
    <linearGradient id="msp-edge" x1="0" y1="50" x2="0" y2="134" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f3eee6" stop-opacity=".35"/>
      <stop offset="1" stop-color="#f3eee6" stop-opacity=".95"/>
    </linearGradient>
    <radialGradient id="msp-spot" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fbf8f3"/>
      <stop offset=".7" stop-color="#f3eee6" stop-opacity=".85"/>
      <stop offset="1" stop-color="#f3eee6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Grundfläche und Ring -->
  <circle cx="100" cy="100" r="99" fill="url(#msp-bg)"/>
  <circle cx="100" cy="100" r="89" fill="none" stroke="#f3eee6" stroke-opacity=".9" stroke-width="1.75"/>

  <g transform="translate(100 94) scale(1.1) translate(-100 -94)">
  <!-- Lichtkegel -->
  <path d="M58 50 V134 H142 Z" fill="url(#msp-beam)"/>
  <path d="M142 50 V134 H58 Z" fill="url(#msp-beam)"/>

  <!-- Außenkanten = Beine des M -->
  <path d="M58.75 50 V134 M141.25 50 V134" stroke="url(#msp-edge)" stroke-width="1.5"/>

  <!-- Lichtflecken auf dem Boden -->
  <ellipse cx="100" cy="134.5" rx="50" ry="6.5" fill="url(#msp-spot)" opacity=".55"/>
  <ellipse cx="95" cy="134.5" rx="40" ry="4.2" fill="#f3eee6" fill-opacity=".55"/>
  <ellipse cx="105" cy="134.5" rx="40" ry="4.2" fill="#f3eee6" fill-opacity=".55"/>
  </g>
</svg>
